name: Actualizar datos de indicadores

on:
  schedule:
    # El INEGI difunde el dato mensual completo entre el día 7 y el 9 de cada
    # mes, a las 6:00 a.m. hora de Ciudad de México (UTC-6, todo el año).
    # Corremos TODOS los días a las 7:00 a.m. CDMX (13:00 UTC): si no hay
    # dato nuevo, el paso "Publicar el dato nuevo" no hace ningún commit,
    # así que no cuesta nada tenerlo corriendo a diario.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions, para probar

permissions:
  contents: write   # necesario para que el robot pueda hacer commit del archivo actualizado

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el script de actualización
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: python actualizar_datos.py

      - name: Publicar el dato nuevo (si cambió)
        run: |
          git config user.name "Robot de indicadores-mx"
          git config user.email "actions@users.noreply.github.com"
          git add data/datos.json
          if git diff --cached --quiet; then
            echo "No hubo cambios; no se publica nada nuevo."
          else
            git commit -m "Actualización automática de datos"
            git push
          fi
